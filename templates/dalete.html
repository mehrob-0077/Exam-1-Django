{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'dalete.css' %}">
    <title>Dalete kino</title>
</head>
<body>

    <h1>Dalete kino</h1>

    <p>Are you sure to dalete this kino «{{ kino.title }}»?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes,dalete</button>
    </form>

    <a href="{% url 'kino_list' %}">No,cancel</a>

</body>
</html>
