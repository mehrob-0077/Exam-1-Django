{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'update.css' %}">
    <title>Update kino</title>
</head>
<body>

    <h1>Update kino</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Name kino:</label>
        <input type="text" name="title" value="{{ kino.title }}" required>
        <br><br>

        <label>Description:</label>
        <textarea name="description">{{ kino.description }}</textarea>
        <br><br>

        <label>Data and Time:</label>
        <input type="datetime-local" name="time" value="{{ kino.time|date:'Y-m-d\\TH:i' }}" required>
        <br><br>

        <label>Price:</label>
        <input type="number" name="price" value="{{ kino.price }}" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" value="{{ kino.age }}" required>
        <br><br>

        <label>Image:</label>
        {% if kino.image %}
            <img src="{{ kino.image.url }}" width="100" alt="Кино">
        {% endif %}
        <input type="file" name="image" accept="image/*">
        <br><br>

        <button type="submit">Add update</button>
    </form>

    <a href="{% url 'kino_list' %}">Back to List</a>

</body>
</html>
